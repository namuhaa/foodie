services:
  # Backend API Web Service
  - type: web
    name: foodie-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  # Frontend Static Site
  - type: web
    name: foodie-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: foodie-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
